<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0b0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workout">
<title>Workout</title>
<style>
/* Bold dark: near-black base, two vivid accents only. Volt lime = actions, progress, done sets;
   hot coral = supersets, partial sets, destructive. Serif headings use the system serif (New York on iOS)
   so nothing downloads. Shapes: cards/panels 18, controls 12 (inner 10), CTA + chips + toggle pill.
   Dark only by design. */
:root{color-scheme:dark;
 --bg:#0b0b0f;--surface:#16161d;--surface2:#24242d;--fg:#f5f5f7;--muted:#a3a3ae;--border:#2a2a33;
 --accent:#c8ff2e;--accent-ink:#0b0b0f;--accent-soft:#c8ff2e1f;--hot:#ff5c7a;--hot-soft:#ff5c7a24;
 --serif:ui-serif,"New York","Iowan Old Style",Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:40rem;margin:0 auto;padding:0 16px calc(150px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--serif)}
.num,input{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ic{width:1.1em;height:1.1em;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em}
.primary:active,.btn:active,.opts button:active{transform:scale(.97)}

/* header */
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
header>div:first-child{display:flex;flex-direction:column}
header .date{order:-1;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
header h1{font-size:40px;line-height:1.05;font-weight:700;margin:4px 0 0}
.seg{display:flex;background:var(--surface);border-radius:99px;padding:3px;gap:2px;margin-bottom:2px}
.seg button{min-height:44px;padding:0 16px;border-radius:99px;font-size:16px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}

/* day picker */
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 16px}
.days button{background:var(--surface);border-radius:18px;padding:10px 6px;text-align:center;min-height:64px;border:2px solid transparent}
.days b{display:block;font-family:var(--serif);font-size:20px;font-weight:700}
.days small{display:block;font-size:14px;color:var(--muted)}
.days button[aria-pressed=true]{border-color:var(--accent)}
.days button[aria-pressed=true] b{color:var(--accent)}

/* hero: lime block with progress ring */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px;margin-bottom:20px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.hero :focus-visible{outline-color:var(--accent-ink)}
.ring{position:relative;width:96px;height:96px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .bg{stroke:#0b0b0f26}.ring .fg{stroke:var(--accent-ink);transition:stroke-dashoffset .25s cubic-bezier(.23,1,.32,1)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;letter-spacing:-.02em}
.ring b small{font-size:14px;font-weight:700}
.kick{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.hero h2{font-size:24px;line-height:1.15;font-weight:700;margin:2px 0 4px}
.hero .sub{font-size:16px;color:#0b0b0fc7}
details.tip{grid-column:1/-1;margin-top:10px;font-size:16px;border-top:1px solid #0b0b0f2e;padding-top:4px}
details.tip summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:4px;min-height:44px}
details.tip summary::-webkit-details-marker{display:none}
details.tip summary .ic{transition:transform .2s}
details.tip[open] summary .ic{transform:rotate(180deg)}
details.tip p{margin:0 0 6px;color:#0b0b0fd9}
.track{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:10px}
.track i{display:block;height:100%;background:var(--accent);border-radius:inherit}

/* exercise cards */
.ss{position:relative;margin:0 0 12px;padding-left:14px}
.ss::before{content:"";position:absolute;left:0;top:30px;bottom:12px;width:4px;border-radius:99px;background:var(--hot)}
.ss>.lbl{display:block;font-size:13px;font-weight:700;color:var(--hot);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px 4px}
.ss .card{margin-bottom:8px}
.card{background:var(--surface);border-radius:18px;margin-bottom:12px;border:2px solid transparent}
.card.cur{border-color:var(--accent)}
.ch{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 14px 0;min-height:44px}
.card:not(.open) .ch{padding-bottom:14px}
.idx{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700;background:var(--surface2);color:var(--muted)}
.cur .idx,.done .idx{background:var(--accent);color:var(--accent-ink)}
.ch .t{flex:1;min-width:0}
.ch h3{font-size:19px;font-weight:700;margin:0;line-height:1.25}
.cur h3{color:var(--accent)}
.ch .meta{font-size:16px;color:var(--muted);margin-top:2px}
.chev{display:grid;color:var(--muted);transition:transform .2s}.open>.ch .chev{transform:rotate(180deg)}
.cb{padding:12px 14px}
.wrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step{display:flex;align-items:center;background:var(--surface2);border-radius:12px;padding:2px}
.step button{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--accent)}
.step button:active{background:var(--border)}
.step input{width:76px;height:44px;border:0;background:var(--bg);border-radius:10px;text-align:center;font-family:inherit;font-size:20px;font-weight:700;color:var(--fg)}
.unit{font-size:16px;color:var(--muted)}
.fixed{font-size:17px;font-weight:600}
.hints{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:15px;font-weight:600;padding:5px 12px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.chip.up{background:var(--accent-soft);color:var(--accent)}
.note{font-size:16px;color:var(--muted);margin:10px 0 0}
/* set table */
.sets{margin:12px -14px 0}
.sr{display:grid;grid-template-columns:48px 1fr 72px 52px;align-items:center;width:100%;min-height:48px;padding:0 14px;text-align:center;font-size:17px;font-weight:600}
.sr.hd{min-height:28px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sr .pv,.sr .ph{color:var(--muted);font-weight:500}
.sr .ck{justify-self:center;width:34px;height:30px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.sr .ck .ic{width:18px;height:18px;stroke-width:3}
button.sr:active{background:var(--surface2)}
.sr[aria-pressed=true]{background:var(--accent-soft)}
.sr[aria-pressed=true] .ck{background:var(--accent);color:var(--accent-ink)}
.sr.part .rp{color:var(--hot)}
.sr.sel{box-shadow:inset 3px 0 0 var(--accent)}
.restrow{display:flex;justify-content:center;margin-top:6px}
.rest{display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:600;color:var(--accent);min-height:44px;padding:0 14px;border-radius:12px}
.reset{display:block;margin:8px auto 0;font-size:16px;font-weight:600;color:var(--hot);min-height:44px;padding:0 16px;border-radius:12px}
.reset.warn{background:var(--hot);color:var(--accent-ink)}

/* timer + bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;pointer-events:none}
.dock>*{pointer-events:auto}
.timer{max-width:40rem;margin:0 auto 10px;padding:0 16px}
.timer .pill{background:var(--surface2);color:var(--fg);border-radius:18px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px #00000080,0 0 0 1px var(--border);position:relative;overflow:hidden}
.timer .pill.flash{background:var(--accent);color:var(--accent-ink)}
.timer .pg{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width .25s linear}
.timer .lbl{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.timer .clock{font-size:28px;font-weight:800;flex:1}
.timer .msg{flex:1;font-weight:700}
.timer button{min-height:44px;padding:0 14px;border-radius:12px;font-weight:600;font-size:16px;background:var(--surface);color:var(--accent)}
.timer .flash button{background:#0b0b0f26;color:var(--accent-ink)}
.bar{background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:40rem;margin:0 auto;display:flex;gap:14px;align-items:center}
.bar .p{min-width:76px}.bar .p b{font-size:24px;font-weight:800}.bar .p span{font-size:16px;color:var(--muted)}
.primary{flex:1;min-height:52px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;transition:transform .12s cubic-bezier(.23,1,.32,1)}
.primary:disabled{opacity:.35;cursor:default}
.primary.confirm{background:var(--fg);color:var(--bg)}

/* history */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 16px}
.stat{background:var(--surface);border-radius:18px;padding:12px}
.stat b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em}.stat span{font-size:14px;font-weight:600;color:var(--muted)}
.stat:first-child b{color:var(--accent)}
.banner{background:var(--accent-soft);color:var(--accent);border-radius:18px;padding:12px 16px;margin-bottom:12px;font-weight:700}
.banner.err{background:var(--hot-soft);color:var(--hot)}
.wk{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 4px 8px}
.hcard{background:var(--surface);border-radius:18px;margin-bottom:8px;overflow:hidden}
.hh{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;min-height:64px}
.tag{flex:none;font-size:14px;font-weight:700;padding:5px 12px;border-radius:99px;background:var(--accent);color:var(--accent-ink)}
.hh .t{flex:1;min-width:0}.hh .d{font-weight:600}.hh .m{font-size:16px;color:var(--muted)}
.hh .chev{transition:transform .2s}.hh[aria-expanded=true] .chev{transform:rotate(180deg)}
.hb{padding:0 14px 12px}
.erow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--border);font-size:16px}
.erow .r{color:var(--muted);text-align:right;white-space:nowrap}
.erow.part .l::after{content:" · partial";color:var(--hot)}
.erow.skip .l{color:var(--muted)}.erow.skip .l::after{content:" · skipped"}
.del{width:100%;min-height:44px;margin-top:8px;border-radius:12px;background:var(--surface2);color:var(--hot);font-weight:600}
.del.warn{background:var(--hot);color:var(--accent-ink)}
.empty{text-align:center;padding:48px 16px 24px;color:var(--muted)}
.empty .ic{width:56px;height:56px;color:var(--accent);margin-bottom:10px;stroke-width:1.8}
.empty b{display:block;font-family:var(--serif);font-size:26px;font-weight:700;color:var(--fg);margin-bottom:4px}
.picker{margin:8px 0 0;background:var(--surface2);border-radius:18px;padding:12px}
.picker .pl{font-size:16px;font-weight:600;color:var(--muted);margin-bottom:10px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{min-width:44px;height:44px;border-radius:12px;background:var(--surface);font-weight:700;font-size:17px;transition:transform .12s cubic-bezier(.23,1,.32,1)}
.opts button.tgt{color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.opts button.sel{background:var(--accent);color:var(--accent-ink)}
.pa{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.pa button{min-height:44px;padding:0 12px;font-size:16px;font-weight:600;color:var(--accent)}
.pa button.clr{color:var(--hot)}
.awake{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:700;color:var(--accent);margin-top:2px}
.panel{background:var(--surface);border-radius:18px;padding:16px;margin-top:16px}
.panel h2{font-size:22px;font-weight:700;margin:0 0 4px}.panel p{font-size:16px;margin:4px 0}
.brow{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;background:var(--surface2);color:var(--accent);font-weight:600;font-size:16px;transition:transform .12s cubic-bezier(.23,1,.32,1)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.howto{margin-top:10px;display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:600;color:var(--accent);min-height:44px}
/* demo: start and end frames side by side, no auto-flipping */
.demo{margin:4px 0 0}
.demo .frames{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.demo img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;border-radius:10px}
.demo .lbls{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:0 12px;margin-top:6px;font-size:16px}
.demo a{color:var(--accent);font-weight:600;text-decoration:none;min-height:44px;display:inline-flex;align-items:center;gap:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body><main id="app"></main><div class="dock"><div id="timer"></div><div id="bar"></div></div>
<script>
// ---------- Program data ----------
const kebab=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const KIND={hand:'lb/hand',side:'lb/side',stack:'lb stack',same:'same as leg press',bw:'Bodyweight'};
const E=(name,sets,reps,def,kind,rest,note='',superset=false)=>({key:kebab(name),name,sets,reps,defaultWeight:def,kind,rest,note,superset});
const PROGRAM={days:[
 {id:'push',label:'Push',weekday:'Mon',focus:'Chest / Shoulders / Triceps',exercises:[
  E('DB Press (flat)',4,'6-8',45,'hand',120,'Dumbbell weight is per hand'),
  E('DB Incline Press',3,'8-10',35,'hand',90),
  E('Cable Fly',3,'12-15',17.5,'side',60,'Squeeze 1 sec at contraction'),
  E('Seated DB Shoulder Press',3,'8-10',25,'hand',90),
  E('Cable Rope Pushdown',3,'10-12',22.5,'stack',60,'Superset with Single-Arm Cable Tricep Pulldown. Rest 1:00 after both',true),
  E('Single-Arm Cable Tricep Pulldown',2,'12-15',7.5,'side',60,'Superset with Cable Rope Pushdown',true)]},
 {id:'pull',label:'Pull',weekday:'Wed',focus:'Back / Rear Delts / Biceps',exercises:[
  E('Lat Pulldown',4,'10',140,'stack',120,'Working back toward 155-160'),
  E('Row Machine',3,'10',80,'stack',90,'Logged 80 Oct 7, felt easy. Go heavier next time'),
  E('One-Arm DB Row',3,'10 / side',25,'hand',60,'Plan range 25-30 per hand. Rest 1:00 per side'),
  E('Cable Face Pull',3,'12-15',27.5,'stack',60,'Plan range 27.5-32.5. Rope to forehead, elbows high'),
  E('DB Curl',3,'10-12',20,'hand',60,'Logged 20 Oct 7. Superset with Cable Hammer Curl',true),
  E('Cable Hammer Curl',2,'15',27,'stack',60,'Logged 27 Oct 7, hard. Hold here. Superset with DB Curl',true)]},
 {id:'legs',label:'Legs',weekday:'Fri',focus:'Quads / Glutes / Hamstrings / Core',exercises:[
  E('Horizontal Leg Press',4,'10-12',null,'stack',120,'Feet shoulder width. Do 2 warm-up sets; first work set should feel like 2 more reps possible. Find your 10-rep weight today and set it here.'),
  E('DB Bulgarian Split Squat',3,'8-10 / leg',25,'hand',90,'Plan range 25-30 per hand'),
  E('DB Romanian Deadlift',3,'10',35,'hand',90,'Plan range 35-40 per hand. Hinge, flat back'),
  Object.assign(E('Leg Press Calf Raise',3,'12-15',null,'same',60,'Uses the same leg press weight. Superset with Cable Glute Kickback. Rest 1:00 after both',true),{usesWeightOf:'horizontal-leg-press'}),
  E('Cable Glute Kickback',3,'12-15',17.5,'stack',60,'Plan range 15-20. Ankle strap if available. Superset with Leg Press Calf Raise',true),
  E('Cable Crunch',3,'12-15',40,'stack',60,'Plan range 35-45. Superset with Plank. Rest 1:00 after both',true),
  E('Plank',3,'45 sec',null,'bw',60,'Bodyweight. Superset with Cable Crunch',true)]}]};
const PROGRESSION='Progression: stay at the same weight until you hit the top of the rep range on every set, then add weight. Machines/leg press +5 to 10 lb. Dumbbells/cables +2.5 to 5 lb.';
const ALL=Object.fromEntries(PROGRAM.days.flatMap(d=>d.exercises.map(e=>[e.key,e])));
function defaultDay(date=new Date()){return ['push','push','push','pull','pull','legs','legs'][date.getDay()]}

// ---------- Storage-backed actions ----------
const K_W='workout-session-weights',K_S='workout-session-sessions',K_C='workout-session-checkoffs';
const LS=(typeof localStorage!=='undefined')?localStorage:{d:{},getItem(k){return k in this.d?this.d[k]:null},setItem(k,v){this.d[k]=String(v)},removeItem(k){delete this.d[k]}};
const rd=(k,f)=>{try{const v=JSON.parse(LS.getItem(k));return v??f}catch{return f}};
const wr=(k,v)=>LS.setItem(k,JSON.stringify(v));
const fail=error=>({ok:false,error});
function effectiveWeight(key,w=rd(K_W,{})){const e=ALL[key];if(!e)return null;if(e.usesWeightOf)return effectiveWeight(e.usesWeightOf,w);if(e.kind==='bw')return null;return key in w?w[key]:e.defaultWeight}
function getWorkoutState(){
 const weights=rd(K_W,{}),checkoffs=rd(K_C,{});
 return{ok:true,program:PROGRAM,weights,checkoffs,defaultDay:defaultDay(),
  effective:Object.fromEntries(Object.keys(ALL).map(k=>[k,effectiveWeight(k,weights)]))}}
function setWeight(exerciseKey,weight){
 const e=ALL[exerciseKey];if(!e)return fail('Unknown exercise');
 if(e.usesWeightOf||e.kind==='bw')return fail('This exercise has no editable weight');
 const w=rd(K_W,{});
 if(weight===null){delete w[exerciseKey];wr(K_W,w);return{ok:true,weight:effectiveWeight(exerciseKey,w)}}
 if(typeof weight!=='number'||!Number.isFinite(weight))return fail('Weight must be a number');
 const r=Math.round(weight*10)/10;if(r<0||r>2000)return fail('Weight must be between 0 and 2000');
 w[exerciseKey]=r;wr(K_W,w);return{ok:true,weight:r}}
function saveCheckoffs(day,map){const c=rd(K_C,{});c[day]=map;wr(K_C,c)}
function finishSession(day,entries){
 const d=PROGRAM.days.find(x=>x.id===day);if(!d)return fail('Unknown day');
 if(!Array.isArray(entries)||!entries.length)return fail('No entries');
 for(const x of entries){if(!x||typeof x.name!=='string'||typeof x.setsLabel!=='string'||typeof x.weightLabel!=='string'||!Number.isInteger(x.setsDone)||!Number.isInteger(x.setsTotal)||x.setsDone<0||x.setsTotal<0||x.setsDone>x.setsTotal)return fail('Invalid entry')}
 const st=rd(K_S,{nextId:1,items:[]});
 const s={id:st.nextId++,day,dayLabel:d.label,finishedAt:new Date().toISOString(),entries:entries.map(x=>({name:x.name,setsLabel:x.setsLabel,weightLabel:x.weightLabel,setsDone:x.setsDone,setsTotal:x.setsTotal,...(Array.isArray(x.reps)?{reps:x.reps.map(n=>Number.isInteger(n)&&n>=0&&n<1000?n:null)}:{})}))};
 st.items.push(s);wr(K_S,st);
 const c=rd(K_C,{});delete c[day];wr(K_C,c);
 return{ok:true,session:s}}
function listSessions(limit=100){
 if(!Number.isInteger(limit)||limit<1)return fail('Invalid limit');limit=Math.min(limit,1000);
 return{ok:true,sessions:rd(K_S,{nextId:1,items:[]}).items.slice().sort((a,b)=>b.id-a.id).slice(0,limit)}}
function deleteSession(id){
 if(!Number.isInteger(id)||id<1)return fail('Invalid id');
 const st=rd(K_S,{nextId:1,items:[]}),n=st.items.length;st.items=st.items.filter(s=>s.id!==id);
 if(st.items.length===n)return fail('Session not found');wr(K_S,st);return{ok:true}}


// ---------- UI ----------
const ui={err:null,tab:'workout',day:defaultDay(),confirmFinish:false,confirmDel:null,confirmReset:false,expanded:null,msg:null,pick:null,demo:null,timer:null,flash:null,open:{}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const fmtW=w=>w==null?'':(Math.round(w*10)/10).toString();
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const rest=s=>s%60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):s/60+' min';
function weightLabel(e,w){if(e.kind==='bw')return 'Bodyweight';if(w==null)return 'Not set';return fmtW(w)+' '+(e.kind==='same'?'lb (leg press)':KIND[e.kind])}
function dayVals(st,day){const d=PROGRAM.days.find(x=>x.id===day);const c=st.checkoffs[day]||{};return Object.fromEntries(d.exercises.map(e=>[e.key,Array.from({length:e.sets},(_,i)=>{const v=(c[e.key]||[])[i];return Number.isInteger(v)&&v>0?v:!!v})]))}
function dayChecks(st,day){return Object.fromEntries(Object.entries(dayVals(st,day)).map(([k,a])=>[k,a.map(Boolean)]))}
// "6-8" -> {lo:6,hi:8}; "10 / side" -> {lo:10,hi:10}; timed sets ("45 sec") -> null
function repRange(e){if(/sec|min/i.test(e.reps))return null;const n=(e.reps.match(/\d+/g)||[]).map(Number);return n.length?{lo:n[0],hi:n[1]||n[0]}:null}
// Consecutive superset exercises are paired two at a time.
function groups(d){const g=[];let ss=null;d.exercises.forEach((e,i)=>{if(e.superset){if(!ss||ss.items.length===2){ss={ss:true,items:[]};g.push(ss)}ss.items.push([e,i])}else{ss=null;g.push({ss:false,items:[[e,i]]})}});return g}
function partnerAfter(d,key){for(const g of groups(d))if(g.ss&&g.items[0][0].key===key)return g.items[1][0];return null}
function lastTime(sessions,name){for(const s of sessions){const x=s.entries.find(y=>y.name===name&&y.setsDone>0);if(x)return x}return null}
const DEMO={'db-press-flat':'Dumbbell_Bench_Press','db-incline-press':'Incline_Dumbbell_Press','cable-fly':'Cable_Crossover','seated-db-shoulder-press':'Dumbbell_Shoulder_Press','cable-rope-pushdown':'Triceps_Pushdown_-_Rope_Attachment','single-arm-cable-tricep-pulldown':'Cable_One_Arm_Tricep_Extension','lat-pulldown':'Wide-Grip_Lat_Pulldown','row-machine':'Seated_Cable_Rows','one-arm-db-row':'One-Arm_Dumbbell_Row','cable-face-pull':'Face_Pull','db-curl':'Dumbbell_Bicep_Curl','cable-hammer-curl':'Cable_Hammer_Curls_-_Rope_Attachment','horizontal-leg-press':'Leg_Press','db-bulgarian-split-squat':'Split_Squat_with_Dumbbells','db-romanian-deadlift':'Stiff-Legged_Dumbbell_Deadlift','leg-press-calf-raise':'Calf_Press_On_The_Leg_Press_Machine','cable-glute-kickback':'One-Legged_Cable_Kickback','cable-crunch':'Cable_Crunch','plank':'Plank'};
const IC={check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',chev:'<path d="M6 9l6 6 6-6"/>',minus:'<path d="M6 12h12"/>',plus:'<path d="M12 6v12M6 12h12"/>',timer:'<circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.5 2M9.5 2.5h5"/>',play:'<path d="M8 5.5v13l10.5-6.5z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',up:'<path d="M12 19V5M6 11l6-6 6 6"/>',bell:'<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>'};

const RING=pct=>{const C=2*Math.PI*42;return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="42"/><circle class="fg" cx="50" cy="50" r="42" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-pct/100)).toFixed(1)}"${pct?'':' stroke-opacity="0"'}/></svg>`};

 const all=Object.values(ch).flat(),n=all.filter(Boolean).length,pct=Math.round(n/all.length*100);
 const left=d.exercises.filter(e=>!ch[e.key].every(Boolean)).length;
 h+=`<section class="hero"><div class="ring" role="progressbar" aria-label="Sets done" aria-valuemin="0" aria-valuemax="${all.length}" aria-valuenow="${n}">${RING(pct)}<b class="num">${pct}<small>%</small></b></div>

  <details class="tip"><summary>How to progress ${ic('chev')}</summary><p>${esc(PROGRESSION.replace(/^Progression: /,''))}</p></details></section>`;
 const cur=d.exercises.find(e=>!ch[e.key].every(Boolean));

  const cards=g.items.map(([e,i])=>card(e,i,st,ch,cur,sessions)).join('');

function card(e,i,st,ch,cur,sessions){
 const w=st.effective[e.key],sets=ch[e.key],done=sets.every(Boolean),isCur=cur&&cur.key===e.key;
 const open=e.key in ui.open?ui.open[e.key]:!done,editable=!(e.kind==='bw'||e.usesWeightOf),ov=e.key in st.weights;
 const last=lastTime(sessions,e.name);
 let h=`<article class="card${isCur?' cur':''}${done?' done':''}${open?' open':''}" id="ex-${e.key}">
  <button class="ch" aria-expanded="${open}" onclick="toggleOpen('${e.key}',${!open})"><span class="idx">${done?ic('check'):i+1}</span>
  <span class="t"><h3>${esc(e.name)}</h3><div class="meta num">${done&&!open?esc(weightLabel(e,w))+' · ':''}${e.sets} × ${esc(e.reps)} · rest ${rest(e.rest)}</div></span><span class="chev">${ic('chev')}</span></button>`;

  else h+=`<div class="fixed num">${esc(weightLabel(e,w))}</div>`;
  if(DEMO[e.key]){const on=ui.demo===e.key;
   h+=`<button class="howto" aria-expanded="${on}" onclick="toggleDemo('${e.key}')">${on?ic('chev')+' Hide demo':ic('play')+' How to'}</button>`;
   if(on){const q=encodeURIComponent(DEMO[e.key].replace(/_-_|[_-]+/g,' ')+' form');
    h+=`<figure class="demo"><div class="frames" role="img" aria-label="${esc(e.name)}: start and end position"><img src="demos/${e.key}-0.jpg" alt=""><img src="demos/${e.key}-1.jpg" alt=""></div><div class="lbls"><span class="muted">Start and end position</span><a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">Watch a video ${ic('ext')}</a></div></figure>`}}
  const chips=[];

   if(rr&&last.reps&&last.reps.length===e.sets&&last.reps.every(x=>x!=null&&x>=rr.hi)&&last.weightLabel===weightLabel(e,w))chips.push(`<span class="chip up">${ic('up')} Hit ${rr.hi}+ on every set. Add weight</span>`)}

  const pv=j=>{if(!last)return '–';const r=last.reps&&last.reps[j],n=(last.weightLabel.match(/^[\d.]+/)||[''])[0];return r!=null?(n?n+' × ':'')+r:j<last.setsDone?(n||'Done'):'–'};
  h+=`<div class="sets"><div class="sr hd" aria-hidden="true"><span>Set</span><span>Previous</span><span>${rr?'Reps':''}</span><span>${ic('check')}</span></div>${vals.map((v,j)=>`<button class="sr num${rr&&typeof v==='number'&&v<rr.lo?' part':''}${pk===j?' sel':''}" aria-pressed="${!!v}" aria-label="Set ${j+1}${v?typeof v==='number'?', '+v+' reps':' done':''}" onclick="toggle('${e.key}',${j})"><span>${j+1}</span><span class="pv">${esc(pv(j))}</span><span class="rp">${typeof v==='number'?v:rr?`<span class="ph">${esc(e.reps.replace(/\s*\/.*$/,''))}</span>`:''}</span><span class="ck">${ic('check')}</span></button>`).join('')}</div><div class="restrow"><button class="rest" onclick="startTimer(${e.rest})" aria-label="Start ${mmss(e.rest)} rest timer">${ic('timer')} Rest ${mmss(e.rest)}</button></div>`;
  if(pk>=0&&rr){const cur=vals[pk],opts=[];for(let n=Math.max(1,rr.lo-3);n<=rr.hi+2;n++)opts.push(`<button class="num${n===cur?' sel':n===rr.hi?' tgt':''}" onclick="logSet('${e.key}',${pk},${n})">${n}</button>`);
   h+=`<div class="picker" role="group" aria-label="Reps for set ${pk+1}"><div class="pl">Set ${pk+1}: how many reps? (target ${esc(e.reps)})</div><div class="opts">${opts.join('')}</div><div class="pa">${cur?`<button class="clr" onclick="logSet('${e.key}',${pk},false)">Clear set</button>`:''}<button onclick="closePick()">Cancel</button></div></div>`}
  h+=`</div>`}
 return h+`</article>`}

function renderHistory(sessions){
 let h='';if(ui.msg)h+=`<div class="banner" role="status">${esc(ui.msg)}</div>`;
 if(!sessions.length)return h+`<div class="empty">${ic('bell')}<b>No sessions yet</b>Finish a workout and it shows up here.</div>`+appPanel();
 const wkStart=t=>{const x=new Date(t);x.setHours(0,0,0,0);x.setDate(x.getDate()-x.getDay());return x.getTime()};
 const now=wkStart(Date.now()),sets=sessions.reduce((a,s)=>a+s.entries.reduce((b,x)=>b+x.setsDone,0),0);
 h+=`<div class="stats"><div class="stat"><b class="num">${sessions.filter(s=>wkStart(s.finishedAt)===now).length}</b><span>This week</span></div><div class="stat"><b class="num">${sessions.length}</b><span>Sessions</span></div><div class="stat"><b class="num">${sets}</b><span>Sets logged</span></div></div>`;

  if(open)h+=`<div class="hb"><div class="track" style="margin:0 0 8px"><i style="width:${tot?Math.round(done/tot*100):0}%"></i></div>${s.entries.map(x=>`<div class="erow${!x.setsDone?' skip':x.setsDone<x.setsTotal?' part':''}"><span class="l">${esc(x.name)}</span><span class="r num">${esc(x.weightLabel)} · ${x.reps&&x.reps.some(n=>n!=null)?esc(x.reps.map(n=>n??'–').join(', ')):x.setsDone+'/'+x.setsTotal}</span></div>`).join('')}<button class="del${ui.confirmDel===s.id?' warn':''}" onclick="del(${s.id})">${ui.confirmDel===s.id?'Tap again to delete':'Delete session'}</button></div>`;

function renderBar(st){const bar=document.getElementById('bar');if(ui.tab!=='workout'){bar.innerHTML='';return}

function renderTimer(){const el=document.getElementById('timer');

 if(!ui.timer){el.innerHTML='';return}const left=Math.max(0,Math.ceil((ui.timer.end-Date.now())/1000)),pct=100-Math.min(100,left/ui.timer.total*100);

function go(t){ui.tab=t;ui.confirmFinish=false;ui.confirmDel=null;ui.confirmReset=false;ui.pick=null;ui.demo=null;if(t==='workout')ui.msg=null;scrollTo(0,0);render()}
function pickDay(d){ui.day=d;ui.pick=null;ui.demo=null;ui.confirmFinish=false;ui.confirmReset=false;ui.open={};render()}
function toggleOpen(key,v){ui.open[key]=v;render()}
function toggleDemo(key){ui.demo=ui.demo===key?null:key;render()}
function commit(key,val){const v=String(val).trim();const cur=getWorkoutState().effective[key];
 if(v===''){if(cur!=null)setWeight(key,null);render();return}const n=parseFloat(v);if(!Number.isFinite(n)){render();return}
 setWeight(key,n<=0?null:n);render()}
function step(key,d){const cur=getWorkoutState().effective[key]??0;const n=Math.round((cur+d)*10)/10;setWeight(key,n<=0?null:Math.min(n,2000));render()}
// Sets with a rep range open the rep picker; timed sets just toggle.
function toggle(key,i){if(repRange(ALL[key])){ui.pick=ui.pick&&ui.pick.key===key&&ui.pick.i===i?null:{key,i};ui.confirmFinish=false;render();return}

function closePick(){ui.pick=null;render()}
function logSet(key,i,val){const st=getWorkoutState(),vals=dayVals(st,ui.day),d=PROGRAM.days.find(x=>x.id===ui.day),e=ALL[key];
 const was=!!vals[key][i];vals[key][i]=val;saveCheckoffs(ui.day,vals);ui.pick=null;ui.confirmFinish=false;ui.confirmReset=false;
 const ch=Object.fromEntries(Object.entries(vals).map(([k,a])=>[k,a.map(Boolean)]));
 if(val&&!was){vib(15);const p=partnerAfter(d,key);
  if(p){cancelTimer();ui.flash='Superset: go straight to '+p.name;clearTimeout(flashT);flashT=setTimeout(clearFlash,4000)}else startTimer(e.rest);
  if(ch[key].every(Boolean)){delete ui.open[key];const next=d.exercises.find(x=>!ch[x.key].every(Boolean));
   render();if(next)requestAnimationFrame(()=>document.getElementById('ex-'+next.key)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'}));return}}
 render()}
function resetSets(){if(!ui.confirmReset){ui.confirmReset=true;render();return}
 const c=rd(K_C,{});delete c[ui.day];wr(K_C,c);ui.confirmReset=false;ui.confirmFinish=false;ui.open={};ui.pick=null;cancelTimer();render()}
function buildEntries(st,day){const d=PROGRAM.days.find(x=>x.id===day),ch=dayChecks(st,day);
 return d.exercises.map(e=>({name:e.name,setsLabel:e.sets+' × '+e.reps,weightLabel:weightLabel(e,st.effective[e.key]),setsDone:ch[e.key].filter(Boolean).length,setsTotal:e.sets,...(repRange(e)?{reps:dayVals(st,day)[e.key].map(v=>typeof v==='number'?v:null)}:{})}))}
function finish(){if(!ui.confirmFinish){ui.confirmFinish=true;render();return}
 const r=finishSession(ui.day,buildEntries(getWorkoutState(),ui.day));ui.confirmFinish=false;
 if(r.ok){cancelTimer();ui.tab='history';ui.expanded=r.session.id;ui.msg='Session logged. Nice work.';ui.open={};scrollTo(0,0)}else ui.err='Couldn’t save this session. Try again.';render()}
function expand(id){ui.expanded=ui.expanded===id?null:id;ui.confirmDel=null;render()}
function del(id){if(ui.confirmDel!==id){ui.confirmDel=id;render();return}deleteSession(id);ui.confirmDel=null;render()}
let tick=null,flashT=null;
function startTimer(sec){cancelTimer();clearFlash();ui.timer={end:Date.now()+sec*1000,total:sec};initAudio();
 tick=setInterval(()=>{if(Date.now()>=ui.timer.end){clearInterval(tick);ui.timer=null;doneAlert()}renderTimer()},250);renderTimer()}
function addTime(s){if(ui.timer){ui.timer.end+=s*1000;ui.timer.total+=s;renderTimer()}}
function cancelTimer(){clearInterval(tick);ui.timer=null;renderTimer()}
function clearFlash(){clearTimeout(flashT);ui.flash=null;renderTimer()}
let actx=null;function initAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch{}}
function doneAlert(){ui.flash='Rest done. Next set!';try{for(let i=0;i<3;i++){const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*0.3;o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.2);o.start(t);o.stop(t+0.2)}}catch{}
 vib([200,100,200]);clearTimeout(flashT);flashT=setTimeout(clearFlash,6000)}

const K_B='workout-last-backup';
function exportData(){const now=new Date(),data={app:'workout',version:1,exportedAt:now.toISOString(),weights:rd(K_W,{}),sessions:rd(K_S,{nextId:1,items:[]}),checkoffs:rd(K_C,{})};
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));
 a.download=`workout-backup-${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}.json`;
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);wr(K_B,now.toISOString());render()}
function importData(file){if(!file)return;file.text().then(t=>{let d;try{d=JSON.parse(t)}catch{d=null}
 const obj=x=>x&&typeof x==='object'&&!Array.isArray(x);
 if(!obj(d)||d.app!=='workout'||!obj(d.weights)||!obj(d.checkoffs)||!obj(d.sessions)||!Number.isInteger(d.sessions.nextId)||!Array.isArray(d.sessions.items)||!d.sessions.items.every(s=>obj(s)&&Number.isInteger(s.id)&&typeof s.finishedAt==='string'&&Array.isArray(s.entries))){ui.err='That file isn’t a workout backup.';render();return}
 const n=d.sessions.items.length;if(!confirm(`Restore the backup from ${new Date(d.exportedAt).toLocaleDateString()}? It has ${n} session${n===1?'':'s'} and replaces everything on this device.`))return;
 wr(K_W,d.weights);wr(K_S,d.sessions);wr(K_C,d.checkoffs);ui.msg=`Backup restored: ${n} session${n===1?'':'s'}.`;ui.expanded=null;scrollTo(0,0);render()})}

const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let installEvt=null;
addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();installEvt=ev;render()});
addEventListener('appinstalled',()=>{installEvt=null;render()});
function install(){if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render()})}}
let wl=null,wantWake=false,wlBusy=false;
async function keepAwake(on){wantWake=on;if(!('wakeLock' in navigator)||wlBusy)return;
 try{if(on&&!wl&&document.visibilityState==='visible'){wlBusy=true;wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null});wlBusy=false;renderBar(getWorkoutState())}
  else if(!on&&wl){const l=wl;wl=null;await l.release();renderBar(getWorkoutState())}}catch{wlBusy=false}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&wantWake)keepAwake(true)});
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(typeof document!=='undefined')render();
</script></body></html>
